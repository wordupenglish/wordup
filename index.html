<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="WordUp English Learning">
<title>WordUp English</title>
<link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>
<header class="top">
  <button class="brand" onclick="goHome()">📚 <span>WordUp</span></button>
  <div class="top-right">
    <span id="xp">⭐ 0 XP</span>
    <button id="theme" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main>
<section id="home" class="screen active">
  <div class="hero">
    <p class="eyebrow">ENGLISH LEARNING</p>
    <h1>Learn English.<br><span>Build Your Future.</span></h1>
    <p>Learn first. Practice next. Master it.</p>
    <button class="primary" onclick="startContinue()">▶ Continue Learning</button>
  </div>

  <div class="stats">
    <div><b id="homeXP">0</b><small>XP</small></div>
    <div><b id="streak">0</b><small>Day Streak</small></div>
    <div><b id="mastery">0%</b><small>Mastery</small></div>
    <div><b id="mistakes">0</b><small>Mistakes</small></div>
  </div>

  <h2>Choose your path</h2>
  <div class="cards">
    <button class="mode" onclick="openCurriculum('Vocabulary')"><span>🧠</span><b>Vocabulary</b><small>Words, pronunciation, meaning & usage</small></button>
    <button class="mode" onclick="openCurriculum('Grammar')"><span>📘</span><b>Grammar</b><small>Learn grammar through examples</small></button>
    <button class="mode" onclick="openCurriculum('Writing')"><span>✍️</span><b>Writing</b><small>Build better English writing</small></button>
    <button class="mode" onclick="openCurriculum('Reading')"><span>📖</span><b>Reading</b><small>Read and understand real English</small></button>
    <button class="mode" onclick="openCurriculum('Listening')"><span>🎧</span><b>Listening</b><small>Listen and understand English</small></button>
  </div>

  <button id="mistakeBtn" class="mistake" onclick="startMistakes()">🔁 Review My Mistakes</button>
</section>

<section id="curriculum" class="screen">
  <button class="back" onclick="goHome()">← Home</button>
  <div class="section-head">
    <p class="eyebrow" id="curriculumType"></p>
    <h1>Your Learning Journey</h1>
    <div class="levels">
      <button onclick="selectLevel('Beginner')" id="Beginner">Beginner</button>
      <button onclick="selectLevel('Intermediate')" id="Intermediate">Intermediate</button>
      <button onclick="selectLevel('Advanced')" id="Advanced">Advanced</button>
    </div>
  </div>
  <div id="lessons"></div>
</section>

<section id="lesson" class="screen">
  <button class="back" onclick="backToCurriculum()">← Lessons</button>
  <div id="lessonContent"></div>
  <button class="primary wide" onclick="beginPractice()">I'm Ready → Practice</button>
</section>

<section id="practice" class="screen">
  <div class="practice-head">
    <span id="practiceLabel"></span>
    <span id="practiceCount"></span>
  </div>
  <div id="practiceContent"></div>
  <button class="primary wide" id="practiceNext" onclick="practiceNext()">Continue →</button>
</section>

<section id="quiz" class="screen">
  <div class="quiz-top">
    <button class="back" onclick="quitQuiz()">✕ Exit</button>
    <span id="quizProgress"></span>
    <span id="quizXP">⭐ 0</span>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div id="question"></div>
  <div id="answers"></div>
  <div id="feedback"></div>
</section>

<section id="result" class="screen">
  <div class="result-box">
    <div class="big-icon">🎉</div>
    <h1 id="resultTitle">Lesson Complete!</h1>
    <p id="resultText"></p>
    <div class="result-stats">
      <div><b id="resultScore">0%</b><small>Score</small></div>
      <div><b id="resultEarned">0</b><small>XP</small></div>
    </div>
    <button class="primary wide" onclick="finishResult()">Continue</button>
  </div>
</section>
</main>

<footer>
  WordUp English · Learn every day, grow every day.
</footer>

<script src="script.js?v=6.0"></script>
</body>
</html>
