name: WordUp engine tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, quality/wordup-audit-2026-11-01]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine tests
        run: node --test tests/engine.test.cjs
      - name: Check changed engine scripts
        run: |
          node --check v12/engine/progress-engine.js
          node --check v12/engine/question-engine.js
          node --check wordup-course.js
          find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
