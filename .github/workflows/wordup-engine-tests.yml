name: WordUp engine and offline tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, quality/wordup-audit-2026-11-01, fix/offline-cache-and-release-qa-2026-11-10]

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine and offline regression tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
